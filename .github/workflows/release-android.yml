# Runs Android JVM unit tests, then builds the debug APK. Publishes to OWNER/weekday-fuel-releases when:
# - push to main: if release v{versionName} does not exist yet (from apps/android/app/build.gradle.kts); or
# - push tag v*: always publish for that tag.
# Secret: WEEKDAY_FUEL_RELEASES_TOKEN. See docs/CI_CD.md.
name: Release Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASES_REPO: ${{ github.repository_owner }}/weekday-fuel-releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/*.gradle*
            apps/android/**/*.gradle*
            apps/android/gradle/libs.versions.toml

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: chmod +x gradlew

      - name: JS unit tests
        run: node --test apps/android/app/src/test/js/cart.test.js apps/android/app/src/test/js/trolley.test.js apps/android/app/src/test/js/catalogue.test.js apps/android/app/src/test/js/catalogue-data.test.js apps/android/app/src/test/js/prices.test.js apps/android/app/src/test/js/checkout.test.js apps/android/app/src/test/js/checkoutview.test.js apps/android/app/src/test/js/orders.test.js apps/android/app/src/test/js/coles-prices.test.js

      # Same debug signing cert as local dev (see docs/CI_CD.md) so GitHub APKs can upgrade installs.
      - name: Decode shared debug keystore
        env:
          B64: ${{ secrets.WEEKDAY_FUEL_SHARED_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::notice::WEEKDAY_FUEL_SHARED_DEBUG_KEYSTORE_B64 not set — APK uses the runner default debug key; in-app updates will not replace a device build signed with a different key."
          else
            echo "$B64" | base64 -d > "${{ github.workspace }}/apps/android/app/ci-shared-debug.keystore"
          fi

      - name: Unit tests + debug APK
        working-directory: apps/android
        env:
          CI: "true"
          WEEKDAY_FUEL_SHARED_DEBUG_KEYSTORE: ${{ github.workspace }}/apps/android/app/ci-shared-debug.keystore
          WEEKDAY_FUEL_SHARED_DEBUG_STORE_PASSWORD: ${{ secrets.WEEKDAY_FUEL_SHARED_DEBUG_STORE_PASSWORD }}
          WEEKDAY_FUEL_SHARED_DEBUG_KEY_ALIAS: ${{ secrets.WEEKDAY_FUEL_SHARED_DEBUG_KEY_ALIAS }}
          WEEKDAY_FUEL_SHARED_DEBUG_KEY_PASSWORD: ${{ secrets.WEEKDAY_FUEL_SHARED_DEBUG_KEY_PASSWORD }}
          # Baked into BuildConfig so sideloaded APKs check the same feed CI publishes to.
          UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          UPDATE_GITHUB_REPO: weekday-fuel-releases
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekday-fuel-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare emulator (KVM + disk space)
        run: |
          # The emulator needs ~7.4 GB free for its userdata partition.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Nothing is published unless the APK survives launch on the target SDK.
      - name: Launch smoke test (Android 15 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.weekdayfuel.app/.MainActivity
            sleep 15
            adb exec-out screencap -p > startup-screenshot.png
            adb logcat -d -b crash
            adb logcat -d -b crash | grep -q "FATAL EXCEPTION" && exit 1 || true
            adb shell dumpsys activity activities | grep -E "ResumedActivity.*dev.weekdayfuel.app"

      - name: Upload startup screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-screenshot
          path: startup-screenshot.png
          if-no-files-found: ignore

      - name: Resolve release tag and APK filename
        id: meta
        if: github.event_name == 'push'
        run: |
          set -e
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            V=$(grep -E 'versionName\s*=\s*"' apps/android/app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
            TAG="v${V}"
            echo "mode=main" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          cp "apps/android/app/build/outputs/apk/debug/app-debug.apk" "WeekdayFuel-${TAG}-debug.apk"
          echo "apk=WeekdayFuel-${TAG}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.WEEKDAY_FUEL_RELEASES_TOKEN }}
          REPO: ${{ env.RELEASES_REPO }}
          TAG: ${{ steps.meta.outputs.tag }}
          MODE: ${{ steps.meta.outputs.mode }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "exists=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::WEEKDAY_FUEL_RELEASES_TOKEN not set — skipping publish to weekday-fuel-releases"
            exit 0
          fi
          if [ "$MODE" = "tag" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${TAG} already exists on ${REPO} — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release to weekday-fuel-releases
        if: github.event_name == 'push' && steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.WEEKDAY_FUEL_RELEASES_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: main
          name: Weekday Fuel ${{ steps.meta.outputs.tag }}
          files: ${{ steps.meta.outputs.apk }}
          generate_release_notes: true
