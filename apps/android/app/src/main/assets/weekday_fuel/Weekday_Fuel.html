<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Weekday Fuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow phone-first column, a sticky tab bar, a day "budget meter" up top; meals are rows with a 3-step portion dial */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --sunk:#E3E9E1; --ink:#16201A; --muted:#5B6960; --line:#D6DED4;
  --accent:#2C50D0; --accent-soft:#DCE3FB; --on-accent:#FFFFFF;
  --yolk:#C9800F; --yolk-soft:#F7E6C6;
  --good:#23794B; --good-soft:#D7EEDF; --warn:#A8650A; --bad:#B5362F; --bad-soft:#F6DCD9; --coles:#C8102E; --woolies:#1A7F3C;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#17201A; --sunk:#1E2822; --ink:#E6ECE7; --muted:#97A49B; --line:#2A352E;
  --accent:#8AA2FF; --accent-soft:#232E55; --on-accent:#0F1411;
  --yolk:#F0B451; --yolk-soft:#3A2D14;
  --good:#5FC58D; --good-soft:#173527; --warn:#E8A949; --bad:#F07C72; --bad-soft:#3D1D1A; --coles:#FF7A7A; --woolies:#5FC58D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#17201A; --sunk:#1E2822; --ink:#E6ECE7; --muted:#97A49B; --line:#2A352E;
  --accent:#8AA2FF; --accent-soft:#232E55; --on-accent:#0F1411;
  --yolk:#F0B451; --yolk-soft:#3A2D14;
  --good:#5FC58D; --good-soft:#173527; --warn:#E8A949; --bad:#F07C72; --bad-soft:#3D1D1A; --coles:#FF7A7A; --woolies:#5FC58D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 96px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs-in{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;width:100%;max-width:680px}
.tab{background:none;border:0;border-radius:10px;padding:8px 2px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.flat{background:var(--sunk);border-radius:var(--r);padding:12px 14px}

/* day nav */
.daynav{display:flex;align-items:center;gap:8px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

/* meter */
.meter{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:420px){.meter{grid-template-columns:1fr}}
.gauge .big{font-family:var(--f-num);font-size:1.7rem;font-weight:600;line-height:1.1}
.gauge .of{font-family:var(--f-num);color:var(--muted);font-size:.9rem}
.bar{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:8px;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .3s}
.bar.p i{background:var(--yolk)}
.bar.over i{background:var(--bad)}
.gauge .left{font-size:.82rem;margin-top:6px;color:var(--muted)}
.gauge .left b{color:var(--ink)}
.macros{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:4px;flex-wrap:wrap}

/* weekly strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:8px 4px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wd .l{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.wd .v{font-family:var(--f-num);font-size:.72rem}
.wd .pip{width:100%;max-width:34px;height:4px;border-radius:2px;background:var(--line)}
.wd.sel{border-color:var(--accent)}
.wd.off{opacity:.55}
.pip.good{background:var(--good)}.pip.warn{background:var(--warn)}.pip.bad{background:var(--bad)}

/* meal rows */
.meal{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:2px}
.meal .slot{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.meal .name{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:1rem;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.meal .what{font-size:.8rem;color:var(--muted)}
.meal .kp{font-family:var(--f-num);font-size:.82rem;text-align:right;white-space:nowrap}
.meal .acts{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dial{display:inline-grid;grid-template-columns:repeat(3,auto);background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.dial button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:.78rem;font-weight:700;color:var(--muted)}
.dial button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ghost{background:none;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.ghost.warn{color:var(--bad);border-color:var(--bad)}
.ghost[aria-pressed="true"]{color:var(--good);border-color:var(--good)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.hint.good{background:var(--good-soft)}
.hint.bad{background:var(--bad-soft)}

/* add picker */
.picker{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;margin-top:10px}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.pick .num{font-size:.78rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chipwrap{display:inline-flex;align-items:stretch;max-width:100%}
.chipwrap .chip{border-top-right-radius:0;border-bottom-right-radius:0;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipedit{border:1px solid var(--line);border-left:0;background:var(--surface);border-radius:0 999px 999px 0;padding:5px 9px;font-size:.68rem;font-weight:700;color:var(--muted);flex:none}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.remake{background:var(--yolk-soft);color:var(--warn)}
.mac{display:block;font-size:.74rem;color:var(--ink);background:var(--sunk);border-radius:7px;padding:5px 8px;margin-top:5px;line-height:1.45}
.mac .src{color:var(--muted);font-family:var(--f-body)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.est{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
input[type=radio],input[type=checkbox]{width:auto;padding:0;margin:0 8px 0 0}
textarea{resize:vertical}
input.num{font-family:var(--f-num)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* meals library */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tiers{width:100%;border-collapse:collapse;font-size:.82rem}
.tiers th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
.tiers th:first-child,.tiers td:first-child{text-align:left}
.tiers td{padding:6px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;vertical-align:top}
.tiers td:first-child{font-family:var(--f-body);font-weight:600}
.tiers td small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.75rem}
.tblwrap{overflow-x:auto}
ol.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
ul.ing{margin:0;padding-left:1.1em;font-size:.88rem;columns:2;column-gap:20px}
@media (max-width:460px){ul.ing{columns:1}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs > div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.vs b{font-family:var(--f-num);font-size:1.05rem;display:block}

/* weigh */
.chart{width:100%;height:auto;display:block}
.wlist{display:flex;flex-direction:column}
.wli{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);gap:10px}
.wli:first-child{border-top:0}
.wtable{width:100%;border-collapse:collapse;font-size:.85rem}
.wtable th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:4px 4px}
.wtable td{padding:7px 4px;border-top:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.verdict{display:flex;flex-direction:column;gap:6px}
.verdict .head{font-family:var(--f-display);font-weight:700;font-size:1.1rem}

/* shop */
.shopsec{display:flex;flex-direction:column}
.si{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.si:first-of-type{border-top:0}
.si input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
.si .p{font-family:var(--f-num);font-size:.85rem;white-space:nowrap;margin-left:auto;font-weight:500}
.si.done .itembtn .grow{text-decoration:line-through;color:var(--muted)}
.itembtn{display:flex;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;font-weight:600;align-items:flex-start}
.picks{display:flex;flex-direction:column;gap:6px}
.pickrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.pickrow.on{border-color:var(--accent);background:var(--accent-soft)}
.pname{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:9px;padding:2px;flex:none}
.step button{width:32px;height:32px;border:0;border-radius:7px;background:var(--surface);font-weight:700;font-size:1rem}
.step button:disabled{opacity:.4;cursor:default}
.step .num{min-width:24px;text-align:center;font-weight:600}
.buy{display:block;margin-top:2px}
.itemdetail{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
a.link{text-decoration:none;display:inline-block;color:var(--accent);border-color:var(--accent)}
.pl{display:flex;gap:10px;align-items:baseline}
.pl .p{font-family:var(--f-num);font-size:.85rem;white-space:nowrap;margin-left:auto;font-weight:500}
.pl.coles,.sp.coles,a.link.coles{color:var(--coles)}
.pl.woolies,.sp.woolies,a.link.woolies{color:var(--woolies)}
.prices{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-num);font-size:.85rem;font-weight:500}
.sp.none{opacity:.7;font-weight:400}
.was{font-size:.75rem;font-weight:600;color:var(--warn);margin-left:6px;white-space:nowrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";

/* ---------- reference data ---------- */
const ICON = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  weigh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10a4 4 0 0 1 8 0"/><path d="M12 10l1.5-2"/></svg>',
  meals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
  kitchen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 10h14"/><path d="M9 6v2"/><path d="M9 13v5"/></svg>',
  targets:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
};
const TABS=[["today","Today"],["weigh","Weigh-in"],["meals","Meals"],["shop","Shop"],["kitchen","Kitchen"],["targets","Targets"]];
const TIERS=[["L","Light"],["S","Standard"],["X","Loaded"]];

const MEALS=WeekdayFuelMeals.MEALS,BATCHES=WeekdayFuelMeals.BATCHES;
const BATCH=Object.fromEntries(BATCHES.map(b=>[b.id,b]));
const PREP_LABEL={assemble:"Assemble",quick:"Quick cook",cook:"Full cook"};
const MEAL = Object.fromEntries(MEALS.map(m=>[m.id,m]));

/* Shop data and maths live in catalogue.js; cached live Woolworths prices replace its Woolworths prices */
const PRICES_KEY="weekdayfuel.v1.prices",COLES_PRICES_KEY="weekdayfuel.v1.colesPrices",LIVE_MAX_AGE=12*3600e3;
const goodAt=s=>typeof s==="string"&&!isNaN(Date.parse(s));
function readPrices(key){try{const c=JSON.parse(localStorage.getItem(key)||"null");return c&&goodAt(c.at)&&c.prices&&typeof c.prices==="object"?c:null}catch(e){return null}}
const livePrices=()=>readPrices(PRICES_KEY),colesPrices=()=>readPrices(COLES_PRICES_KEY);
function buildCat(){const W=WeekdayFuelCatalogue,lp=livePrices(),cp=colesPrices();let items=W.ITEMS;if(lp)items=W.applyLivePrices(items,lp.prices);if(cp)items=W.applyColesPrices(items,cp.prices);return W.create(items,W.AMOUNTS)}
let CAT=buildCat();
const STORES=["coles","woolies"];
const STORE_NAME={coles:"Coles",woolies:"Woolworths"};
const store=()=>S().store==="coles"?"coles":"woolies";
const other=s=>s==="coles"?"woolies":"coles";
/* Planned days in the shop: settings.shopDays {date:true}; a day's meal with shop:false is left out */
const shopDays=()=>{const sd=S().shopDays||{};return Object.keys(sd).filter(d=>sd[d]).sort()};
function dayMealsFrom(mealOk){
  return shopDays().flatMap(d=>((state.days[d]&&state.days[d].meals)||[]).filter(m=>m.shop!==false&&!WeekdayFuelBought.isBought(m)&&(!mealOk||mealOk(m))).map(m=>({day:d,meal:m.id,t:m.t})));
}
function runBoughtBackfillIfNeeded(){
  if(S().boughtBackfill)return;
  const r=WeekdayFuelBought.backfillBought(state.days,lsOrders());
  if(r.changed.length){state.days=r.days;r.changed.forEach(d=>saveDay(d))}
  state.settings.boughtBackfill=true;
  saveSettings();
}
function runStaplesFxMigrateIfNeeded(){
  if(S().staplesFxMigrated)return;
  const r=WeekdayFuelStaples.migrateLegacyFx(state.days);
  if(r.changed){state.days=r.days;(r.changedDates||[]).forEach(d=>saveDay(d))}
  state.settings.staplesFxMigrated=true;
  saveSettings();
}
function staplesActiveOn(date){return WeekdayFuelStaples.activeStaples(staplesList(),date)}
function dayMealsAll(){return dayMealsFrom(null)}
function dayMeals(){
  const inv=lsInv();
  return dayMealsFrom(inv?m=>typeof m.ate!=="string":null);

/* ---------- domain logic ---------- */
const S=()=>state.settings;
const target=()=>({k:S().kcal[S().mode]+S().adjust,p:S().protein});
function dayOf(date){
  if(state.days[date])return state.days[date];
  return {meals:[],extras:[],track:false};
}
function ensureDay(date){if(!state.days[date])state.days[date]=clone(dayOf(date));return state.days[date]}
function totals(day,date){
  const t={k:0,p:0,c:0,f:0,cost:0};
  if(date){
    staplesOn(date).forEach(s=>{
      const m=WeekdayFuelStaples.macros(s.id,s.amount,CAT,MACROS);
      if(m){t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f}
      const c=WeekdayFuelStaples.cost(s.id,s.amount,CAT,store());
      if(c!=null)t.cost+=c;
    });
  }
  (day.meals||[]).forEach(m=>{const meal=MEAL[m.id];if(!meal)return;const x=meal.t[m.t];t.k+=x.k;t.p+=x.p;t.c+=x.c;t.f+=x.f;t.cost+=mealCosts(meal)[m.t]});
  (day.extras||[]).forEach(x=>{t.k+=+x.k||0;t.p+=+x.p||0});
  return t;
}
function tracked(date){const d=state.days[date];return !isWeekend(date)||(d&&d.track)}
function dayUnlocked(date){return !!(state.unlocked&&state.unlocked[date])}
function mealLocked(m,date){return WeekdayFuelBought.isBought(m)&&!dayUnlocked(date)}
function boughtShopLabel(meals){
  const m=(meals||[]).find(x=>WeekdayFuelBought.isBought(x));
  if(!m)return "Bought";
  const id=m.bought;
  if(typeof id==="string"&&!isNaN(Date.parse(id)))return "Bought with your shop on "+fmtShort(iso(new Date(id)));
  return "Bought";
}
function clearUnboughtSkipDates(){if(!lsSent()&&!lsColesSent())return null;return shopDays();}
/* choose L/S/X for each meal so the day lands closest to target, protein first; the first `locked` meals keep their portions */
function fitTiers(day,locked,date){
  const all=day.meals||[];const lk=locked||0;
  const unlocked=date&&dayUnlocked(date);
  const fixed=(m,i)=>i<lk||typeof m.ate==="string"||(WeekdayFuelBought.isBought(m)&&!unlocked);
  const ms=all.filter((m,i)=>MEAL[m.id]&&!fixed(m,i));if(!ms.length)return;
  const base=totals({fx:day.fx,meals:all.filter((m,i)=>fixed(m,i)),extras:day.extras},date);
  const tg=target();let best=null;
  const keys=["L","S","X"];const n=ms.length;const combos=Math.pow(3,n);
  for(let i=0;i<combos;i++){
    let k=base.k,p=base.p,x=i;const pick=[];
    for(let j=0;j<n;j++){const t=keys[x%3];x=Math.floor(x/3);pick.push(t);const v=MEAL[ms[j].id].t[t];k+=v.k;p+=v.p}
    const score=Math.abs(k-tg.k)+Math.max(0,tg.p-p)*12;
    if(!best||score<best.score)best={score,pick};
  }
  ms.forEach((m,j)=>m.t=best.pick[j]);
}
function recentIds(date,back){const s=new Set();for(let i=1;i<=back;i++){const d=state.days[addDays(date,-i)];if(d&&d.meals)d.meals.forEach(m=>s.add(m.id))}return s}
function randomPick(list,avoid){const pool=list.filter(m=>!avoid.has(m.id));const src=pool.length?pool:list;return src[Math.floor(Math.random()*src.length)]}
function suggestDay(date){
  const day=ensureDay(date);
  const used=new Set(recentIds(date,1));
  const kept=(day.meals||[]).filter(m=>typeof m.ate==="string"||WeekdayFuelBought.isBought(m));
  kept.forEach(m=>used.add(m.id));
  const keptSlots=new Set(kept.map(m=>m.slot));
  const pick=(slot,kind)=>{
    if(keptSlots.has(slot))return [];
    const m=randomPick(MEALS.filter(x=>x.slots.includes(kind)),used);used.add(m.id);
    return [{id:m.id,slot,t:"S"}];
  };
  const added=[...pick("breakfast","breakfast"),...pick("lunch","main"),...pick("dinner","main")];
  day.meals=kept.concat(added).sort((a,b)=>SLOT_ORDER.indexOf(a.slot)-SLOT_ORDER.indexOf(b.slot));
  fitTiers(day,0,date);saveDay(date);
}
function swapMeal(date,idx){
  const day=ensureDay(date);const m=day.meals[idx];
  const kind=m.slot==="breakfast"?"breakfast":m.slot==="snack"?"snack":"main";
  const avoid=new Set(day.meals.map(x=>x.id));recentIds(date,1).forEach(x=>avoid.add(x));
  const n=randomPick(MEALS.filter(x=>x.slots.includes(kind)),avoid);
  const next=Object.assign({},m,{id:n.id});delete next.ate;day.meals[idx]=next;saveDay(date);
}
const SLOT_ORDER=["breakfast","lunch","snack","dinner"];
function trolleySent(){return !!(lsSent()||lsColesSent())}
const NEXT_SHOP_NOTE="Your trolley's already sent, so the new meals aren't in it. After you save that order, tap Add day to shop on each day.";
function suggestWeek(){
  const P=WeekdayFuelPlanner,w=P.weekDays(state.date,iso(new Date())),s=store();
  const mealsOf=d=>(state.days[d]&&state.days[d].meals)||[];
  const before={},kept={},unknown={};
  w.before.forEach(d=>{before[d]=mealsOf(d)});
  w.dates.forEach(d=>{kept[d]=mealsOf(d).filter(m=>MEAL[m.id]);unknown[d]=mealsOf(d).filter(m=>!MEAL[m.id])});
  if(w.dates.every(d=>["breakfast","lunch","dinner"].every(sl=>kept[d].some(m=>m.slot===sl)))){state.weekNote="Every day already has a breakfast, lunch and dinner. Remove the meals you want replaced, then tap again.";return}
  const chicken=m=>(m.batch||[]).includes("chicken");
  const pools={
    breakfast:MEALS.filter(m=>m.slots.includes("breakfast")).map(m=>m.id),
    lunch:MEALS.filter(m=>m.slots.includes("main")&&chicken(m)).map(m=>m.id),
    dinner:MEALS.filter(m=>m.slots.includes("main")&&!chicken(m)).map(m=>m.id)
  };
  const fit=(d,meals,locked)=>{const day=dayOf(d);fitTiers({fx:day.fx,meals,extras:day.extras},locked,d)};
  const havePlan=shopHave();
  const r=P.planWeek({dates:w.dates,before,kept,pools,fit,score:dm=>P.shopScore(CAT,dm,s,havePlan)});
  if(!r){state.weekNote="Couldn't plan this week. Try Suggest a day for each day instead.";return}
  const sd=state.settings.shopDays=Object.assign({},S().shopDays);
  const held=trolleySent();
  const changed=w.dates.filter(d=>r.days[d].length!==kept[d].length);
  changed.forEach(d=>{const day=ensureDay(d);day.meals=r.days[d].concat(unknown[d]).sort((a,b)=>SLOT_ORDER.indexOf(a.slot)-SLOT_ORDER.indexOf(b.slot));if(!sd[d])day.meals.forEach(m=>delete m.shop);else if(held)day.meals.forEach(m=>{if(!kept[d].includes(m)&&!unknown[d].includes(m))m.shop=false});saveDay(d);if(!held)sd[d]=true});
  saveSettings();
  shopCtx=null;
  const haveCost=shopHave();
  const first=changed[0],last=changed[changed.length-1];
  const wdm=w.dates.flatMap(d=>r.days[d].map(m=>({day:d,meal:m.id,t:m.t})));
  const weekCost=CAT.storeTotals(CAT.shopList({},0,wdm,haveCost),s,{}).total;
  state.weekNote=`Planned ${dayShort(first)}${last!==first?"–"+dayShort(last):""}: ${r.distinct} different meals, about ${money(weekCost)} of groceries at ${STORE_NAME[s]}. ${held?NEXT_SHOP_NOTE:"The days are in your shop."}`;
  state.date=first;state.adding=null;
}
function planSummary(plan){
  return WeekdayFuelPlans.summary(plan,counts=>{
    const rows=CAT.shopList(counts,0,[]);
    return {items:rows.length,total:CAT.storeTotals(rows,store(),{}).total};
  });
}
function applyPlan(id,start){
  const plan=WeekdayFuelPlans.byId(id);if(!plan)return;
  const r=WeekdayFuelPlans.fill(plan,start,state.days);
  const changed=Object.keys(r.changes);
  if(!changed.length){state.weekNote="Those days are already planned. Nothing changed.";state.tab="today";state.date=r.dates[0];state.sheet=null;state.planStart=null;window.scrollTo(0,0);return}
  const sd=state.settings.shopDays=Object.assign({},S().shopDays);
  const held=trolleySent();
  changed.forEach(d=>{
    const day=ensureDay(d);
    const old=day.meals||[];
    const meals=r.changes[d].meals;
    const locked=meals.filter(m=>old.includes(m));
    const fresh=meals.filter(m=>!old.includes(m));
    day.meals=locked.concat(fresh);
    fitTiers(day,locked.length,d);
    day.meals=meals;
    if(held&&sd[d])fresh.forEach(m=>m.shop=false);
    saveDay(d);if(!held)sd[d]=true;
  });
  saveSettings();shopCtx=null;
  const first=changed[0],last=changed[changed.length-1];
  state.weekNote=`Added ${r.added} meal${r.added===1?"":"s"}, ${dayShort(first)}${last!==first?" – "+dayShort(last):""}.${r.kept?` Kept ${r.kept} you'd already planned.`:""}${held?" "+NEXT_SHOP_NOTE:""}`;
  state.tab="today";state.date=first;state.sheet=null;state.planStart=null;window.scrollTo(0,0);
}

/* weight analytics */
function weightSeries(){return Object.keys(state.weights).filter(k=>state.weights[k]&&isFinite(state.weights[k].kg)).sort().map(k=>({d:k,kg:+state.weights[k].kg}))}
function avgWindow(endDate,days){const start=addDays(endDate,-(days-1));const v=weightSeries().filter(x=>x.d>=start&&x.d<=endDate);if(!v.length)return null;return {avg:v.reduce((a,b)=>a+b.kg,0)/v.length,n:v.length}}
function verdict(){
  const today=iso(new Date());
  const cur=avgWindow(today,7),prev=avgWindow(addDays(today,-7),7);
  const mode=MODES[S().mode];
  if(!cur||cur.n<3)return {state:"wait",head:"Keep weighing in",body:"Log at least 3 weigh-ins this week and the trend will show here. Weigh first thing in the morning, after the toilet, before food or the Dare."};
  if(!prev||prev.n<3)return {state:"wait",head:"7-day average: "+cur.avg.toFixed(1)+" kg",body:"You need one more week of weigh-ins to compare against. Keep logging."};
  const delta=cur.avg-prev.avg;
  let adj=0,head,st="good";
  if(delta<mode.lo){adj=+150;st="bad";head="Dropping faster than planned"}
  else if(delta>mode.hi){adj=-150;st="bad";head=S().mode==="bulk"?"Gaining faster than planned":"Trending up"}
  else if(S().mode==="cut"&&delta>-0.25){adj=-150;st="bad";head="Cut has stalled"}
  else if(S().mode==="bulk"&&delta<0.1){adj=+150;st="bad";head="Not gaining yet"}
  else head="On track for "+mode.label.toLowerCase();
  const body="This week averaged "+cur.avg.toFixed(1)+" kg vs "+prev.avg.toFixed(1)+" kg last week ("+(delta>=0?"+":"")+delta.toFixed(2)+" kg). Target pace for "+mode.label.toLowerCase()+" is "+(mode.rate>0?"+":"")+mode.rate.toFixed(2)+" kg/week."+(adj?" Suggest moving weekday calories "+(adj>0?"up":"down")+" "+Math.abs(adj)+" kcal.":" Keep weekdays where they are.");
  return {state:st,head,body,adj,delta};
}

function gauge(label,val,tgt,unit,cls){
  const pct=Math.min(100,tgt?val/tgt*100:0);const over=val>tgt*1.05&&cls!=="p";
  const left=tgt-val;
  const leftTxt=cls==="p"
    ? (left>0?`<b>${r0(left)}g</b> protein still to go`:`Protein target hit`)
    : (left>=0?`<b>${r0(left)}</b> kcal left to spend`:`<b>${r0(-left)}</b> kcal over`);
  return `<div class="gauge"><div class="eyebrow">${label}</div><div class="row" style="gap:6px;align-items:baseline"><span class="big">${r0(val)}</span><span class="of">/ ${tgt}${unit}</span></div><div class="bar ${cls||""} ${over?"over":""}"><i style="width:${pct}%"></i></div><div class="left">${leftTxt}</div></div>`;
}
function weekStrip(){
  const mon=monday(state.date);const tg=target();
  const names=["MON","TUE","WED","THU","FRI","SAT","SUN"];
  let cells="";let wk=0,wkT=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i);const day=state.days[d];const on=tracked(d);
    const hasMeals=day&&((day.meals&&day.meals.length)||(day.extras&&day.extras.length));
    let pip="",v="–";
    if(on&&hasMeals){const t=totals(day,d);v=r0(t.k);wk+=t.k;wkT+=tg.k;const off=Math.abs(t.k-tg.k);pip=off<=150?"good":off<=350?"warn":"bad";if(t.p<tg.p-15&&pip==="good")pip="warn"}
    else if(on&&i<5){wkT+=0}
    cells+=`<button class="wd ${d===state.date?"sel":""} ${on?"":"off"}" data-act="goto" data-v="${d}" aria-label="${fmtDay(d)}"><span class="l">${names[i]}</span><span class="v">${on?v:"off"}</span><span class="pip ${pip}"></span></button>`;
  }
  const diff=wk-wkT;
  const summary=wkT?`Planned weekdays so far: <b class="num">${r0(wk)}</b> of <b class="num">${r0(wkT)}</b> kcal (${diff>=0?"+":""}${r0(diff)}).`:`Plan a weekday to start the week's tally.`;
  return `<div class="stack" style="gap:8px"><div class="week">${cells}</div><div class="small muted">${summary} Weekends are off the books, and the weigh-in trend absorbs them.</div></div>`;
}

function chartSVG(){
  const series=weightSeries();const today=iso(new Date());
  const start=addDays(today,-34);
  const pts=series.filter(x=>x.d>=start);
  if(pts.length<2)return "";
  const W=640,H=220,L=44,R=12,T=14,B=28;
  const days=35;const xOf=d=>L+(Math.round((parse(d)-parse(start))/864e5))/(days-1)*(W-L-R);
  const kgs=pts.map(p=>p.kg);let lo=Math.min(...kgs),hi=Math.max(...kgs);if(hi-lo<1.5){const m=(hi+lo)/2;lo=m-0.75;hi=m+0.75}
  lo=Math.floor(lo*2)/2-0.25;hi=Math.ceil(hi*2)/2+0.25;
  const yOf=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let grid="";const step=(hi-lo)>4?1:0.5;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yOf(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v.toFixed(step<1?1:0)}</text>`}
  // rolling 7-day average per day with data
  const avgPts=[];for(let i=0;i<days;i++){const d=addDays(start,i);const a=avgWindow(d,7);if(a&&state.weights[d])avgPts.push([xOf(d),yOf(a.avg)])}
  const path=avgPts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=avgPts.length>1?path+` L${avgPts[avgPts.length-1][0].toFixed(1)} ${H-B} L${avgPts[0][0].toFixed(1)} ${H-B} Z`:"";
  const dots=pts.map(p=>`<circle cx="${xOf(p.d).toFixed(1)}" cy="${yOf(p.kg).toFixed(1)}" r="3" fill="var(--muted)" opacity=".55"/>`).join("");
  const last=avgPts[avgPts.length-1];
  let xl="";for(let i=0;i<days;i+=7){const d=addDays(start,i);xl+=`<text x="${xOf(d)}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle" font-family="Figtree, sans-serif">${fmtShort(d)}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over the last 5 weeks with 7-day average">${grid}${xl}${area?`<path d="${area}" fill="var(--accent)" opacity=".10"/>`:""}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${last?`<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:""}</svg>`;
}
function weekTable(){
  const series=weightSeries();if(!series.length)return "";

  const keys=Object.keys(weeks).sort().slice(-8);
  let prev=null;const rows=keys.map(k=>{const a=weeks[k].reduce((s,v)=>s+v,0)/weeks[k].length;const ch=prev==null?"":((a-prev>=0?"+":"")+(a-prev).toFixed(2));prev=a;return `<tr><td>${fmtShort(k)}</td><td>${a.toFixed(2)}</td><td>${ch}</td><td>${weeks[k].length}</td></tr>`}).reverse().join("");
  return `<div class="tblwrap"><table class="wtable"><thead><tr><th>Week of</th><th>Avg kg</th><th>Change</th><th>Weigh-ins</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  return h;
}

function renderMeals(){

    case "sendtrolley":sendTrolley(state.trolley&&state.trolley.haveIt||{});break;
    case "trolleyreset":state.trolley=null;break;
    case "checkout":openCheckout();window.scrollTo(0,0);break;
    case "colescheckout":if(state.trolley)state.trolley.checkedOut=true;WeekdayFuelHost.postMessage(JSON.stringify({type:"colesCheckout"}));break;
    case "cotry":{if(coBusy())break;const old=state.checkout;openCheckout();if(old&&old.phase==="ready"){state.checkout.optDraft=old.optDraft;state.checkout.subsDraft=old.subsDraft}break}
    case "coday":if(state.checkout)state.checkout.day=v;break;
    case "cochange":{const c=state.checkout;if(c&&c.result&&c.result.booked)c.day=String(c.result.booked.start).slice(0,10);render();const t=document.getElementById("co-time");if(t)t.scrollIntoView({block:"start"});return}
    case "coslot":coSave("book",{timeslotId:+v,windowDate:el.dataset.d});break;
    case "coaddr":{const c=state.checkout;if(!c||c.phase!=="ready"||!c.result.addresses||+v===c.result.addresses.current)break;coSave("address",{addressId:+v});break}
    case "cosub":{const c=state.checkout;if(!c||c.phase!=="ready")break;const it=((c.result.summary&&c.result.summary.items)||[]).find(i=>String(i.stockcode)===v);if(!it||it.fixed)break;const shown=v in c.subsDraft?c.subsDraft[v]:it.allow;if(!shown===it.allow)delete c.subsDraft[v];else c.subsDraft[v]=!shown;break}
    case "cosuball":{const c=state.checkout;if(!c||c.phase!=="ready")break;c.subsDraft=WeekdayFuelCheckoutView.allDraft((c.result.summary&&c.result.summary.items)||[],v==="1");break}
    case "cosubsave":{const c=state.checkout;if(!c||c.phase!=="ready")break;const ch=WeekdayFuelCheckoutView.subsView((c.result.summary&&c.result.summary.items)||[],c.subsDraft).changes;if(ch.length)coSave("subs",{items:ch});break}
    case "cooptsave":{const c=state.checkout;if(!c||c.phase!=="ready"||!c.optDraft)break;coSave("options",{instructions:c.optDraft.instructions,leaveUnattended:!!c.optDraft.leaveUnattended});break}
    case "copay":if(coBusy())break;if(state.checkout)state.checkout.paid=true;if(state.trolley)state.trolley.checkedOut=true;WeekdayFuelHost.postMessage(JSON.stringify({type:"openWoolworths",url:CO_URL}));break;
    case "codone":state.coLast=(state.checkout&&state.checkout.result)||state.coLast;state.checkout=null;break;
    case "openwoolies":if(coBusy())return;WeekdayFuelHost.postMessage(JSON.stringify({type:"openWoolworths",url:v}));return;
    case "opencoles":WeekdayFuelHost.postMessage(JSON.stringify({type:"openColes",url:v}));return;
    default:return;
  }
  render();
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="wform"){
    const kg=parseFloat($("#wkg").value);const d=$("#wdate").value||iso(new Date());
    if(!isFinite(kg)||kg<30||kg>250){$("#wkg").focus();return}
    state.weights[d]={kg:Math.round(kg*10)/10,at:new Date().toISOString()};saveWeight(d);render();
  }
  if(e.target.id==="xform"){
    const n=$("#xn").value.trim(),k=parseFloat($("#xk").value),p=parseFloat($("#xp").value)||0;
    if(!isFinite(k)){$("#xk").focus();return}
    const d=ensureDay(state.date);d.extras=d.extras||[];d.extras.push({n:n||"Extra",k,p});saveDay(state.date);render();
  }
  if(e.target.id==="stapform"){
    syncStapleSheetDraft();
    const draft=state.stapleSheetDraft;
    const id=draft&&draft.id;
    const amt=draft&&draft.amount;
    const days=draft&&draft.days==="all"?"all":"weekdays";
    const today=iso(new Date());
    if(!id||!MACROS[id]||!CAT.item(id)){return}
    if(!isFinite(amt)||!(amt>0)){state.stapleSheetError="Enter an amount above 0";$("#stap-amt")&&$("#stap-amt").focus();render();return}
    state.stapleSheetError=null;
    const seed=staplesSeedList();
    const isEdit=state.sheet!=="staple:new"||staplesToday().some(s=>s.id===id);
    const parsed=isEdit?WeekdayFuelStaples.applyEdit(seed,id,{amount:amt,days},today,CAT):WeekdayFuelStaples.applyAdd(seed,{id,amount:amt,days},today,CAT);
    staplesPersistParsed(parsed);
    state.sheet=null;state.stapleSheetDraft=null;render();
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="stap-item"&&state.stapleSheetDraft){
    const it=CAT.item(el.value);
    state.stapleSheetDraft.id=el.value;
    if(it)state.stapleSheetDraft.amount=stapleDefaultAmount(it);
    state.stapleSheetError=null;
    render();
    return;
  }
  if(el.id==="kadd-item"){state.kAddItem=el.value;state.kitchenHint=null;state.kitchenHintWhere=null;return}
  if(!el.dataset||!el.dataset.set)return;
  const val=parseFloat(el.value);if(!isFinite(val))return;
  const path=el.dataset.set.split(".");let o=state.settings;
  for(let j=0;j<path.length-1;j++)o=o[path[j]];
  o[path[path.length-1]]=val;saveSettings();render();
});
document.addEventListener("input",e=>{
  const c=state.checkout,el=e.target;if(!c||!c.result||(el.id!=="co-note"&&el.id!=="co-unatt"))return;
  const o=c.result.options||{},d=c.optDraft||(c.optDraft={instructions:o.instructions||"",leaveUnattended:!!o.leaveUnattended});
  if(el.id==="co-note")d.instructions=el.value;else d.leaveUnattended=el.checked;
  c.optSaved=false;const b=document.querySelector('[data-act="cooptsave"]');if(b&&!coBusy())b.disabled=false;
  const ok=document.getElementById("co-optsaved");if(ok)ok.remove();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.sheet){state.sheet=null;render()}});

if(window.WeekdayFuelHost){
  WeekdayFuelHost.addEventListener("message",e=>{
    let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(!m)return;
    if(m.type==="pricesDone"||m.type==="pricesError"){onPrices(m);if(state.tab==="shop")render();return}
    if(m.type==="colesPricesDone"||m.type==="colesPricesError"){onColesPrices(m);if(state.tab==="shop")render();return}
    if(m.type==="checkoutDone"||m.type==="checkoutError"){onCheckout(m);if(state.tab==="shop")render();return}
    const t=state.trolley;if(!t)return;
    const live=(t.phase==="adding"||t.phase==="login")&&Array.isArray(t.lines);
    const s=t.store==="coles"?"coles":"woolies",pre=s==="coles"?"colesTrolley":"trolley";
    if(typeof m.type!=="string"||!m.type.startsWith(pre))return;
    const ty=m.type.slice(pre.length);
    if(ty==="Login"){if(!live)return;t.phase="login"}
    else if(ty==="Progress"){if(t.phase!=="adding"&&t.phase!=="login")return;t.phase="adding";t.completed=m.completed;t.total=m.total}
    else if(ty==="Done"){if(!live)return;t.phase="done";t.results=Array.isArray(m.results)?m.results:[];const old=sentFor(s),rec={at:new Date().toISOString(),fingerprint:t.fingerprint,lines:WeekdayFuelCart.sentAfter(old&&old.lines,t.lines,t.results,TROLLEY[s].key)};if(t.haveIt&&typeof t.haveIt==="object")rec.haveIt=Object.assign({},t.haveIt);setSentFor(s,rec)}
    else if(ty==="Error"){if(!live)return;t.phase="error";t.message=m.message||(s==="coles"?"Couldn't send to the Coles trolley.":"Something went wrong sending to Woolworths. Try again.")}
    else return;
    if(state.tab==="shop")render();
  });
}
initStore();
})();
</script>
