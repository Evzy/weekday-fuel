<style>
/* Layout: one narrow phone-first column, a sticky tab bar, a day "budget meter" up top; meals are rows with a 3-step portion dial */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --sunk:#E3E9E1; --ink:#16201A; --muted:#5B6960; --line:#D6DED4;
  --accent:#2C50D0; --accent-soft:#DCE3FB; --on-accent:#FFFFFF;
  --yolk:#C9800F; --yolk-soft:#F7E6C6;
  --good:#23794B; --good-soft:#D7EEDF; --warn:#A8650A; --bad:#B5362F; --bad-soft:#F6DCD9;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#17201A; --sunk:#1E2822; --ink:#E6ECE7; --muted:#97A49B; --line:#2A352E;
  --accent:#8AA2FF; --accent-soft:#232E55; --on-accent:#0F1411;
  --yolk:#F0B451; --yolk-soft:#3A2D14;
  --good:#5FC58D; --good-soft:#173527; --warn:#E8A949; --bad:#F07C72; --bad-soft:#3D1D1A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#17201A; --sunk:#1E2822; --ink:#E6ECE7; --muted:#97A49B; --line:#2A352E;
  --accent:#8AA2FF; --accent-soft:#232E55; --on-accent:#0F1411;
  --yolk:#F0B451; --yolk-soft:#3A2D14;
  --good:#5FC58D; --good-soft:#173527; --warn:#E8A949; --bad:#F07C72; --bad-soft:#3D1D1A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 96px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:680px}
.tab{background:none;border:0;border-radius:10px;padding:8px 4px;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.flat{background:var(--sunk);border-radius:var(--r);padding:12px 14px}

/* day nav */
.daynav{display:flex;align-items:center;gap:8px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

/* meter */
.meter{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:420px){.meter{grid-template-columns:1fr}}
.gauge .big{font-family:var(--f-num);font-size:1.7rem;font-weight:600;line-height:1.1}
.gauge .of{font-family:var(--f-num);color:var(--muted);font-size:.9rem}
.bar{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:8px;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .3s}
.bar.p i{background:var(--yolk)}
.bar.over i{background:var(--bad)}
.gauge .left{font-size:.82rem;margin-top:6px;color:var(--muted)}
.gauge .left b{color:var(--ink)}
.macros{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:4px;flex-wrap:wrap}

/* weekly strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:8px 4px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wd .l{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.wd .v{font-family:var(--f-num);font-size:.72rem}
.wd .pip{width:100%;max-width:34px;height:4px;border-radius:2px;background:var(--line)}
.wd.sel{border-color:var(--accent)}
.wd.off{opacity:.55}
.pip.good{background:var(--good)}.pip.warn{background:var(--warn)}.pip.bad{background:var(--bad)}

/* fixtures */
.fx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.fx{grid-template-columns:1fr}}
.fxb{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.fxb[aria-pressed="true"]{border-style:solid;border-color:var(--yolk);background:var(--yolk-soft)}
.fxb .tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.fxb[aria-pressed="true"] .tick{background:var(--yolk);border-color:var(--yolk);color:var(--surface)}
.fxb .tick svg{width:14px;height:14px}
.fxb b{display:block;font-size:.9rem}

/* meal rows */
.meal{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:2px}
.meal .slot{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.meal .name{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:1rem;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.meal .what{font-size:.8rem;color:var(--muted)}
.meal .kp{font-family:var(--f-num);font-size:.82rem;text-align:right;white-space:nowrap}
.meal .acts{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dial{display:inline-grid;grid-template-columns:repeat(3,auto);background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.dial button{border:0;background:none;border-radius:7px;padding:5px 10px;font-size:.78rem;font-weight:700;color:var(--muted)}
.dial button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ghost{background:none;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.ghost.warn{color:var(--bad);border-color:var(--bad)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--on-accent)}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.hint.good{background:var(--good-soft)}
.hint.bad{background:var(--bad-soft)}

/* add picker */
.picker{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;margin-top:10px}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.pick .num{font-size:.78rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.remake{background:var(--yolk-soft);color:var(--warn)}
.mac{display:block;font-size:.74rem;color:var(--ink);background:var(--sunk);border-radius:7px;padding:5px 8px;margin-top:5px;line-height:1.45}
.mac .src{color:var(--muted);font-family:var(--f-body)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.est{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
input.num{font-family:var(--f-num)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* meals library */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tiers{width:100%;border-collapse:collapse;font-size:.82rem}
.tiers th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
.tiers th:first-child,.tiers td:first-child{text-align:left}
.tiers td{padding:6px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;vertical-align:top}
.tiers td:first-child{font-family:var(--f-body);font-weight:600}
.tiers td small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.75rem}
.tblwrap{overflow-x:auto}
ol.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
ul.ing{margin:0;padding-left:1.1em;font-size:.88rem;columns:2;column-gap:20px}
@media (max-width:460px){ul.ing{columns:1}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs > div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.vs b{font-family:var(--f-num);font-size:1.05rem;display:block}

/* weigh */
.chart{width:100%;height:auto;display:block}
.wlist{display:flex;flex-direction:column}
.wli{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);gap:10px}
.wli:first-child{border-top:0}
.wtable{width:100%;border-collapse:collapse;font-size:.85rem}
.wtable th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:4px 4px}
.wtable td{padding:7px 4px;border-top:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.verdict{display:flex;flex-direction:column;gap:6px}
.verdict .head{font-family:var(--f-display);font-weight:700;font-size:1.1rem}

/* shop */
.shopsec{display:flex;flex-direction:column}
.si{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.si:first-of-type{border-top:0}
.si input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
.si .p{font-family:var(--f-num);font-size:.85rem;white-space:nowrap;margin-left:auto;font-weight:500}
.si.done .itembtn .grow{text-decoration:line-through;color:var(--muted)}
.itembtn{display:flex;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;font-weight:600;align-items:flex-start}
.picks{display:flex;flex-direction:column;gap:6px}
.pickrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.pickrow.on{border-color:var(--accent);background:var(--accent-soft)}
.pname{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:9px;padding:2px;flex:none}
.step button{width:32px;height:32px;border:0;border-radius:7px;background:var(--surface);font-weight:700;font-size:1rem}
.step button:disabled{opacity:.4;cursor:default}
.step .num{min-width:24px;text-align:center;font-weight:600}
.buy{display:block;margin-top:2px}
.itemdetail{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
a.link{text-decoration:none;display:inline-block;color:var(--accent);border-color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>parse(s).getDay();
const isWeekend=s=>{const g=dow(s);return g===0||g===6};
const monday=s=>{const g=dow(s);return addDays(s,g===0?-6:1-g)};
const fmtDay=s=>parse(s).toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"short"});
const fmtShort=s=>parse(s).toLocaleDateString("en-AU",{day:"numeric",month:"short"});
const money=n=>"$"+n.toFixed(2);
const r0=n=>Math.round(n);
const clone=o=>JSON.parse(JSON.stringify(o));
function deepMerge(base,over){const out=clone(base);if(!over)return out;for(const k in over){if(k==="trial"){out[k]=clone(over[k]);continue}if(over[k]&&typeof over[k]==="object"&&!Array.isArray(over[k])&&out[k]&&typeof out[k]==="object")out[k]=deepMerge(out[k],over[k]);else out[k]=over[k];}return out}

/* ---------- state + storage ---------- */
const state={tab:"today",date:iso(new Date()),settings:clone(DEFAULT_SETTINGS),days:{},weights:{},adding:null,mealFilter:"all",sheet:null,armed:null,openItem:null};
let db=null;
const LS="weekdayfuel.v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({settings:state.settings,days:state.days,weights:state.weights}))}catch(e){}}
function lsTicks(){try{return JSON.parse(localStorage.getItem(LS+".shop")||"{}")}catch(e){return {}}}
function lsSetTicks(t){try{localStorage.setItem(LS+".shop",JSON.stringify(t))}catch(e){}}

const timers={};
function queueWrite(path,body){
  lsSave();
  if(!db)return;
  clearTimeout(timers[path]);
  timers[path]=setTimeout(async()=>{
    try{ body===null ? await db.doc(path).delete() : await db.doc(path).set(body); }
    catch(e){ setSync(false,"Couldn't save — "+(e&&e.code||"error")); }
  },450);
}
function setSync(on,text){$("#syncdot").className="dot"+(on?" on":"");$("#synctext").textContent=text}

function saveDay(date){const d=state.days[date];queueWrite("days/"+date,d?clone(d):null)}
function saveWeight(date){const w=state.weights[date];queueWrite("weights/"+date,w?clone(w):null)}
function saveSettings(){queueWrite("config/settings",clone(state.settings))}

async function initStore(){
  const cached=lsGet();
  if(cached){state.settings=deepMerge(DEFAULT_SETTINGS,cached.settings);state.days=cached.days||{};state.weights=cached.weights||{};}
  setSync(false,"Saved on this device");
  render();
  try{ if(window.claude&&window.claude.use) db=await window.claude.use("db"); }catch(e){db=null}
  if(!db){setSync(false,"Saved on this device only");return}
  setSync(true,"Synced");
  const onErr=e=>setSync(false,"Sync paused ("+(e&&e.code||"error")+")");
  db.collection("days").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});state.days=clone(m);lsSave();render()},onErr);
  db.collection("weights").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});state.weights=clone(m);lsSave();render()},onErr);
  db.doc("config/settings").onSnapshot(s=>{if(s.exists){state.settings=deepMerge(DEFAULT_SETTINGS,s.data());lsSave();render()}},onErr);
}

/* ---------- domain logic ---------- */
const S=()=>state.settings;
const target=()=>({k:S().kcal[S().mode]+S().adjust,p:S().protein});
function dayOf(date){
  if(state.days[date])return state.days[date];
  return {fx:{dare:!isWeekend(date),grenade:!isWeekend(date)},meals:[],extras:[],track:false};
}
function ensureDay(date){if(!state.days[date])state.days[date]=clone(dayOf(date));return state.days[date]}
function totals(day){
  const t={k:0,p:0,c:0,f:0,cost:0};
  for(const key in S().fixtures){if(day.fx&&day.fx[key]){const x=S().fixtures[key];t.k+=x.k;t.p+=x.p;t.c+=x.c;t.f+=x.f;t.cost+=x.cost}}
  (day.meals||[]).forEach(m=>{const meal=MEAL[m.id];if(!meal)return;const x=meal.t[m.t];t.k+=x.k;t.p+=x.p;t.c+=x.c;t.f+=x.f;t.cost+=x.cost});
  (day.extras||[]).forEach(x=>{t.k+=+x.k||0;t.p+=+x.p||0});
  return t;
}
function tracked(date){const d=state.days[date];return !isWeekend(date)||(d&&d.track)}
/* choose L/S/X for each meal so the day lands closest to target, protein first */
function fitTiers(day){
  const ms=day.meals||[];if(!ms.length)return;
  const base=totals({fx:day.fx,meals:[],extras:day.extras});
  const tg=target();let best=null;
  const keys=["L","S","X"];const n=ms.length;const combos=Math.pow(3,n);
  for(let i=0;i<combos;i++){
    let k=base.k,p=base.p,x=i;const pick=[];
    for(let j=0;j<n;j++){const t=keys[x%3];x=Math.floor(x/3);pick.push(t);const v=MEAL[ms[j].id].t[t];k+=v.k;p+=v.p}
    const score=Math.abs(k-tg.k)+Math.max(0,tg.p-p)*12;
    if(!best||score<best.score)best={score,pick};
  }
  ms.forEach((m,j)=>m.t=best.pick[j]);
}
function recentIds(date,back){const s=new Set();for(let i=1;i<=back;i++){const d=state.days[addDays(date,-i)];if(d&&d.meals)d.meals.forEach(m=>s.add(m.id))}return s}
function randomPick(list,avoid){const pool=list.filter(m=>!avoid.has(m.id));const src=pool.length?pool:list;return src[Math.floor(Math.random()*src.length)]}
function suggestDay(date){
  const day=ensureDay(date);
  const avoid=recentIds(date,1);
  const used=new Set(avoid);
  const b=randomPick(MEALS.filter(m=>m.slots.includes("breakfast")&&m.id!=="yogbowl"),used);used.add(b.id);
  const l=randomPick(MEALS.filter(m=>m.slots.includes("main")),used);used.add(l.id);
  const d=randomPick(MEALS.filter(m=>m.slots.includes("main")),used);
  day.meals=[{id:b.id,slot:"breakfast",t:"S"},{id:l.id,slot:"lunch",t:"S"},{id:d.id,slot:"dinner",t:"S"}];
  fitTiers(day);saveDay(date);
}
function swapMeal(date,idx){
  const day=ensureDay(date);const m=day.meals[idx];
  const kind=m.slot==="breakfast"?"breakfast":m.slot==="snack"?"snack":"main";
  const avoid=new Set(day.meals.map(x=>x.id));recentIds(date,1).forEach(x=>avoid.add(x));
  const n=randomPick(MEALS.filter(x=>x.slots.includes(kind)),avoid);
  day.meals[idx]={id:n.id,slot:m.slot,t:m.t};saveDay(date);
}

/* weight analytics */
function weightSeries(){return Object.keys(state.weights).filter(k=>state.weights[k]&&isFinite(state.weights[k].kg)).sort().map(k=>({d:k,kg:+state.weights[k].kg}))}
function avgWindow(endDate,days){const start=addDays(endDate,-(days-1));const v=weightSeries().filter(x=>x.d>=start&&x.d<=endDate);if(!v.length)return null;return {avg:v.reduce((a,b)=>a+b.kg,0)/v.length,n:v.length}}
function verdict(){
  const today=iso(new Date());
  const cur=avgWindow(today,7),prev=avgWindow(addDays(today,-7),7);
  const mode=MODES[S().mode];
  if(!cur||cur.n<3)return {state:"wait",head:"Keep weighing in",body:"Log at least 3 weigh-ins this week and the trend will show here. Weigh first thing in the morning, after the toilet, before food or the Dare."};
  if(!prev||prev.n<3)return {state:"wait",head:"7-day average: "+cur.avg.toFixed(1)+" kg",body:"You need one more week of weigh-ins to compare against. Keep logging."};
  const delta=cur.avg-prev.avg;
  let adj=0,head,st="good";
  if(delta<mode.lo){adj=+150;st="bad";head="Dropping faster than planned"}
  else if(delta>mode.hi){adj=-150;st="bad";head=S().mode==="bulk"?"Gaining faster than planned":"Trending up"}
  else if(S().mode==="cut"&&delta>-0.25){adj=-150;st="bad";head="Cut has stalled"}
  else if(S().mode==="bulk"&&delta<0.1){adj=+150;st="bad";head="Not gaining yet"}
  else head="On track for "+mode.label.toLowerCase();
  const body="This week averaged "+cur.avg.toFixed(1)+" kg vs "+prev.avg.toFixed(1)+" kg last week ("+(delta>=0?"+":"")+delta.toFixed(2)+" kg). Target pace for "+mode.label.toLowerCase()+" is "+(mode.rate>0?"+":"")+mode.rate.toFixed(2)+" kg/week."+(adj?" Suggest moving weekday calories "+(adj>0?"up":"down")+" "+Math.abs(adj)+" kcal.":" Keep weekdays where they are.");
  return {state:st,head,body,adj,delta};
}

}
function gauge(label,val,tgt,unit,cls){
  const pct=Math.min(100,tgt?val/tgt*100:0);const over=val>tgt*1.05&&cls!=="p";
  const left=tgt-val;
  const leftTxt=cls==="p"
    ? (left>0?`<b>${r0(left)}g</b> protein still to go`:`Protein target hit`)
    : (left>=0?`<b>${r0(left)}</b> kcal left to spend`:`<b>${r0(-left)}</b> kcal over`);
  return `<div class="gauge"><div class="eyebrow">${label}</div><div class="row" style="gap:6px;align-items:baseline"><span class="big">${r0(val)}</span><span class="of">/ ${tgt}${unit}</span></div><div class="bar ${cls||""} ${over?"over":""}"><i style="width:${pct}%"></i></div><div class="left">${leftTxt}</div></div>`;
}
function weekStrip(){
  const mon=monday(state.date);const tg=target();
  const names=["MON","TUE","WED","THU","FRI","SAT","SUN"];
  let cells="";let wk=0,wkT=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i);const day=state.days[d];const on=tracked(d);
    const hasMeals=day&&((day.meals&&day.meals.length)||(day.extras&&day.extras.length));
    let pip="",v="–";
    if(on&&hasMeals){const t=totals(day);v=r0(t.k);wk+=t.k;wkT+=tg.k;const off=Math.abs(t.k-tg.k);pip=off<=150?"good":off<=350?"warn":"bad";if(t.p<tg.p-15&&pip==="good")pip="warn"}
    else if(on&&i<5){wkT+=0}
    cells+=`<button class="wd ${d===state.date?"sel":""} ${on?"":"off"}" data-act="goto" data-v="${d}" aria-label="${fmtDay(d)}"><span class="l">${names[i]}</span><span class="v">${on?v:"off"}</span><span class="pip ${pip}"></span></button>`;
  }
  const diff=wk-wkT;
  const summary=wkT?`Planned weekdays so far: <b class="num">${r0(wk)}</b> of <b class="num">${r0(wkT)}</b> kcal (${diff>=0?"+":""}${r0(diff)}).`:`Plan a weekday to start the week's tally.`;
  return `<div class="stack" style="gap:8px"><div class="week">${cells}</div><div class="small muted">${summary} Weekends are off the books, and the weigh-in trend absorbs them.</div></div>`;
}

function chartSVG(){
  const series=weightSeries();const today=iso(new Date());
  const start=addDays(today,-34);
  const pts=series.filter(x=>x.d>=start);
  if(pts.length<2)return "";
  const W=640,H=220,L=44,R=12,T=14,B=28;
  const days=35;const xOf=d=>L+(Math.round((parse(d)-parse(start))/864e5))/(days-1)*(W-L-R);
  const kgs=pts.map(p=>p.kg);let lo=Math.min(...kgs),hi=Math.max(...kgs);if(hi-lo<1.5){const m=(hi+lo)/2;lo=m-0.75;hi=m+0.75}
  lo=Math.floor(lo*2)/2-0.25;hi=Math.ceil(hi*2)/2+0.25;
  const yOf=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let grid="";const step=(hi-lo)>4?1:0.5;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){grid+=`<line x1="${L}" x2="${W-R}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yOf(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v.toFixed(step<1?1:0)}</text>`}
  // rolling 7-day average per day with data
  const avgPts=[];for(let i=0;i<days;i++){const d=addDays(start,i);const a=avgWindow(d,7);if(a&&state.weights[d])avgPts.push([xOf(d),yOf(a.avg)])}
  const path=avgPts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=avgPts.length>1?path+` L${avgPts[avgPts.length-1][0].toFixed(1)} ${H-B} L${avgPts[0][0].toFixed(1)} ${H-B} Z`:"";
  const dots=pts.map(p=>`<circle cx="${xOf(p.d).toFixed(1)}" cy="${yOf(p.kg).toFixed(1)}" r="3" fill="var(--muted)" opacity=".55"/>`).join("");
  const last=avgPts[avgPts.length-1];
  let xl="";for(let i=0;i<days;i+=7){const d=addDays(start,i);xl+=`<text x="${xOf(d)}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle" font-family="Figtree, sans-serif">${fmtShort(d)}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over the last 5 weeks with 7-day average">${grid}${xl}${area?`<path d="${area}" fill="var(--accent)" opacity=".10"/>`:""}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${last?`<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:""}</svg>`;
}
function weekTable(){
  const series=weightSeries();if(!series.length)return "";
  const weeks={};series.forEach(x=>{const m=monday(x.d);(weeks[m]=weeks[m]||[]).push(x.kg)});
  const keys=Object.keys(weeks).sort().slice(-8);
  let prev=null;const rows=keys.map(k=>{const a=weeks[k].reduce((s,v)=>s+v,0)/weeks[k].length;const ch=prev==null?"":((a-prev>=0?"+":"")+(a-prev).toFixed(2));prev=a;return `<tr><td>${fmtShort(k)}</td><td>${a.toFixed(2)}</td><td>${ch}</td><td>${weeks[k].length}</td></tr>`}).reverse().join("");
  return `<div class="tblwrap"><table class="wtable"><thead><tr><th>Week of</th><th>Avg kg</th><th>Change</th><th>Weigh-ins</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

  return h;
}

function buildList(){

  const map={today:renderToday,weigh:renderWeigh,meals:renderMeals,shop:renderShop,targets:renderTargets};
  v.innerHTML=map[state.tab]();
  renderSheet();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,v=el.dataset.v,i=+el.dataset.i;
  if(act==="close"&&el.classList.contains("scrim")&&e.target!==el)return;
  if(act!=="rm"&&act!=="rmw")state.armed=null;
  const date=state.date;
  switch(act){
    case "tab":state.tab=v;state.adding=null;window.scrollTo(0,0);break;
    case "shift":state.date=addDays(date,+v);state.adding=null;break;
    case "goto":state.date=v;state.adding=null;break;
    case "track":{const d=ensureDay(date);d.track=true;d.fx={dare:true,grenade:true};saveDay(date);break}
    case "untrack":{const d=ensureDay(date);d.track=false;saveDay(date);break}
    case "fx":{const d=ensureDay(date);d.fx=d.fx||{};d.fx[v]=!d.fx[v];saveDay(date);break}
    case "suggest":suggestDay(date);state.adding=null;break;
    case "fit":{const d=ensureDay(date);fitTiers(d);saveDay(date);break}
    case "tier":{const d=ensureDay(date);d.meals[i].t=v;saveDay(date);break}
    case "swap":swapMeal(date,i);break;
    case "rm":{if(state.armed==="rm"+i){const d=ensureDay(date);d.meals.splice(i,1);saveDay(date);state.armed=null}else state.armed="rm"+i;break}
    case "adding":state.adding=state.adding===v?null:v;break;
    case "add":{const d=ensureDay(date);d.meals=d.meals||[];d.meals.push({id:v,slot:state.adding,t:"S"});state.adding=null;saveDay(date);break}
    case "addto":{const d=ensureDay(date);d.meals=d.meals||[];d.meals.push({id:v,slot:el.dataset.s,t:"S"});saveDay(date);state.sheet=null;state.tab="today";break}
    case "rmx":{const d=ensureDay(date);d.extras.splice(i,1);saveDay(date);break}
    case "recipe":state.sheet=v;break;
    case "close":state.sheet=null;break;
    case "mf":state.mealFilter=v;break;
    case "mode":state.settings.mode=v;saveSettings();break;
    case "applyadj":state.settings.adjust=(state.settings.adjust||0)+(+v);saveSettings();break;
    case "rmw":{if(state.armed==="w"+v){delete state.weights[v];saveWeight(v);state.armed=null}else state.armed="w"+v;break}
    case "tick":{const t=lsTicks();t[v]=el.checked;lsSetTicks(t);break}
    case "untickall":lsSetTicks({});break;
    case "openitem":state.openItem=state.openItem===v?null:v;break;
    case "shopmode":state.settings.shopMode=v;saveSettings();break;
    case "serve":{const pk=picks();const n=Math.max(0,Math.min(10,(pk[v]||0)+i));if(n)pk[v]=n;else delete pk[v];state.settings.trial=pk;saveSettings();break}
    case "starter":state.settings.trial=clone(STARTER);saveSettings();break;
    case "clearpicks":state.settings.trial={};saveSettings();break;
    case "fxdays":{const d=S().fixtureDays==null?5:S().fixtureDays;state.settings.fixtureDays=Math.max(0,Math.min(7,d+i));saveSettings();break}
    default:return;
  }
  render();
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="wform"){
    const kg=parseFloat($("#wkg").value);const d=$("#wdate").value||iso(new Date());
    if(!isFinite(kg)||kg<30||kg>250){$("#wkg").focus();return}
    state.weights[d]={kg:Math.round(kg*10)/10,at:new Date().toISOString()};saveWeight(d);render();
  }
  if(e.target.id==="xform"){
    const n=$("#xn").value.trim(),k=parseFloat($("#xk").value),p=parseFloat($("#xp").value)||0;
    if(!isFinite(k)){$("#xk").focus();return}
    const d=ensureDay(state.date);d.extras=d.extras||[];d.extras.push({n:n||"Extra",k,p});saveDay(state.date);render();
  }
});
document.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.set)return;
  const val=parseFloat(el.value);if(!isFinite(val))return;
  const path=el.dataset.set.split(".");let o=state.settings;
  for(let j=0;j<path.length-1;j++)o=o[path[j]];
  o[path[path.length-1]]=val;saveSettings();render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.sheet){state.sheet=null;render()}});

initStore();
})();
</script>

</body></html>
